<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <form>
        <label for="name">שם:</label>
        <input type="text" name="fullname" />
        <br />
        <label for="email">אימייל:</label>
        <input id="email" name="email" type="email" />
        <br />
        <label for="password">סיסמה:</label>
        <input type="password" name="pwd" />
        <br />
        <label for="age">גיל:</label>
        <input type="number" name="age" min="0" max="120" />
        <br />
        <label for="text">מין:</label>
        <label><input type="radio" name="gender" value="male"> זכר</label>
        <label><input type="radio" name="gender" value="female"> נקבה</label>
        <br />
        <label><input type="checkbox" name="subscribe">אני מסכים/ה לתנאים</label>
        <label for="text">קורות חיים(PDF):</label>
        <input type="file" name="file" />
    </form>
